<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Nueva Tarea</ion-title>
    <ion-buttons slot="start">
      <ion-button color="light">Cancelar</ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button [disabled]="form.invalid" color="light" strong>
        Agregar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-item class="form-item">
      <ion-label position="stacked">Título <span class="required">*</span></ion-label>
      <ion-input
        formControlName="title"
        placeholder="¿Qué necesitas hacer?"
        [clearInput]="true"
        autocapitalize="sentences"
      ></ion-input>
    </ion-item>

    <ion-item class="form-item ion-margin-top">
      <ion-label position="stacked">Descripción (opcional)</ion-label>
      <ion-textarea
        formControlName="description"
        placeholder="Añade más detalles..."
        [rows]="3"
        [autoGrow]="true"
      ></ion-textarea>
    </ion-item>

    <ion-item class="form-item ion-margin-top">
      <ion-label position="stacked">Categoría</ion-label>
      <ion-select formControlName="category" interface="popover" placeholder="Selecciona una categoría">
        @for (cat of categories; track cat.value) {
          <ion-select-option [value]="cat.value">{{ cat.label }}</ion-select-option>
        }
      </ion-select>
    </ion-item>
  </form>
</ion-content>
